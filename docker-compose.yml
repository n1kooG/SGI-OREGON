# Solo infraestructura de desarrollo: PostgreSQL 16 + Redis. El backend y el frontend se corren con npm.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sgi_oregon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Se ejecutan SOLO la primera vez (volumen vacío), en orden alfabético: modelo y luego datos de ejemplo.
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sgi_oregon"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
